version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fingerprint-server
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    networks:
      - fingerprint-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # 安全选项
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fingerprint-client
    environment:
      - SERVER_URL=http://server:8080
      - INPUT_FILE=/data/input.json
    volumes:
      - ./test-data.json:/data/input.json:ro
    networks:
      - fingerprint-net
    depends_on:
      server:
        condition: service_healthy
    restart: "no"
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    # 安全选项
    security_opt:
      - no-new-privileges:true

networks:
  fingerprint-net:
    driver: bridge
    internal: false
