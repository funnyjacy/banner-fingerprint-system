# Banner 指纹识别规则配置
# 规则与代码解耦，便于维护和扩展

rules:
  # SSH 协议识别
  - name: "SSH"
    protocol: "SSH"
    patterns:
      - regex: "^SSH-([0-9.]+)-OpenSSH_([0-9.p]+)\\s*(.*?)$"
        product: "OpenSSH"
        version_group: 2
        os_hint_group: 3
        confidence: 0.95
      - regex: "^SSH-"
        product: "SSH"
        confidence: 0.7
    os_hints:
      - match: "Ubuntu"
        hint: "Ubuntu"
      - match: "Debian"
        hint: "Debian"
      - match: "CentOS"
        hint: "CentOS"

  # HTTP 协议识别
  - name: "HTTP"
    protocol: "HTTP"
    patterns:
      - regex: "Server:\\s*nginx/([0-9.]+)"
        product: "nginx"
        version_group: 1
        confidence: 0.9
      - regex: "Server:\\s*Apache/([0-9.]+)"
        product: "Apache"
        version_group: 1
        confidence: 0.9
      - regex: "Server:\\s*Jetty/([0-9.]+)"
        product: "Jetty"
        version_group: 1
        confidence: 0.85
      - regex: "Server:\\s*Microsoft-IIS/([0-9.]+)"
        product: "Microsoft-IIS"
        version_group: 1
        confidence: 0.9
      - regex: "HTTP/[0-9.]+"
        product: "HTTP"
        confidence: 0.6
    os_hints:
      - match: "Ubuntu"
        hint: "Ubuntu"
      - match: "Debian"
        hint: "Debian"
      - match: "Win"
        hint: "Windows"

  # MySQL 协议识别
  - name: "MySQL"
    protocol: "MySQL"
    patterns:
      - regex: "\\n([0-9.]+)\\x00"
        product: "MySQL"
        version_group: 1
        confidence: 0.9
      - regex: "\\\\n([0-9.]+)\\\\u0000"
        product: "MySQL"
        version_group: 1
        confidence: 0.9
      - regex: "mysql"
        product: "MySQL"
        confidence: 0.7

  # Redis 协议识别
  - name: "Redis"
    protocol: "Redis"
    patterns:
      - regex: "\\+PONG"
        product: "Redis"
        confidence: 0.9
      - regex: "-ERR.*command"
        product: "Redis"
        confidence: 0.8
      - regex: "-NOAUTH"
        product: "Redis"
        confidence: 0.85

  # FTP 协议识别
  - name: "FTP"
    protocol: "FTP"
    patterns:
      - regex: "220.*ProFTPD\\s+([0-9.]+)"
        product: "ProFTPD"
        version_group: 1
        confidence: 0.9
      - regex: "220.*vsFTPd\\s+([0-9.]+)"
        product: "vsFTPd"
        version_group: 1
        confidence: 0.9
      - regex: "220.*Pure-FTPd"
        product: "Pure-FTPd"
        confidence: 0.85
      - regex: "220"
        product: "FTP"
        confidence: 0.6

  # SSL/TLS 协议识别
  - name: "SSL"
    protocol: "SSL/TLS"
    patterns:
      - regex: "\\x16\\x03"
        product: "SSL/TLS"
        confidence: 0.7
